version: 2
# One PR per ecosystem: separate PRs each rewrite the same lockfile
# (package-lock.json, Cargo.lock + supply-chain/imports.lock), so merging one
# conflicted the next.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 21
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 21
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 21
    groups:
      github-actions:
        patterns: ["*"]
