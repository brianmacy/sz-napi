name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Build configtool native addon (no Senzing runtime needed)
  # ---------------------------------------------------------------------------
  build-configtool:
    name: Build configtool (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout sz-napi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sz-napi

      - name: Checkout sz-rust-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brianmacy/sz-rust-sdk
          path: sz-rust-sdk

      - name: Checkout sz-rust-sdk-configtool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brianmacy/sz-rust-sdk-configtool
          path: sz-rust-sdk-configtool

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: sz-napi
        run: npm ci

      - name: Build configtool
        working-directory: sz-napi/packages/configtool
        run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: configtool-${{ matrix.target }}
          path: sz-napi/packages/configtool/*.node
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build SDK native addon — Linux (requires Senzing runtime for linking)
  # Amazon Linux 2023 container provides yum access to Senzing packages
  # ---------------------------------------------------------------------------
  build-sdk-linux:
    name: Build SDK (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    container:
      image: amazonlinux:2023
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Install system dependencies
        run: |
          yum install -y git tar gzip gcc gcc-c++ make openssl-devel \
            findutils xz sqlite-devel

      - name: Checkout sz-napi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sz-napi

      - name: Checkout sz-rust-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brianmacy/sz-rust-sdk
          path: sz-rust-sdk

      - name: Checkout sz-rust-sdk-configtool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brianmacy/sz-rust-sdk-configtool
          path: sz-rust-sdk-configtool

      - name: Install Senzing runtime
        env:
          SENZING_ACCEPT_EULA: I_ACCEPT_THE_SENZING_EULA
        run: |
          yum install -y https://senzing-production-yum.s3.amazonaws.com/senzingrepo-2.0.1-1.noarch.rpm
          yum install -y senzingsdk-runtime

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: sz-napi
        run: npm ci

      - name: Build SDK
        working-directory: sz-napi/packages/sdk
        run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-${{ matrix.target }}
          path: sz-napi/packages/sdk/*.node
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build SDK native addon — macOS and Windows
  # macOS: Senzing runtime via Homebrew (rpath embedded, no DYLD_LIBRARY_PATH)
  # Windows: Senzing runtime via Scoop
  # ---------------------------------------------------------------------------
  build-sdk-host:
    name: Build SDK (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout sz-napi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sz-napi

      - name: Checkout sz-rust-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brianmacy/sz-rust-sdk
          path: sz-rust-sdk

      - name: Checkout sz-rust-sdk-configtool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brianmacy/sz-rust-sdk-configtool
          path: sz-rust-sdk-configtool

      - name: Install Senzing runtime (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_SENZING_ACCEPT_EULA: i_accept_the_senzing_eula
        run: |
          brew tap senzing/senzingsdk https://github.com/Senzing/homebrew-senzingsdk
          # Homebrew 6+ refuses to load casks from an untrusted tap; no-op on Homebrew 5.
          brew trust senzing/senzingsdk
          brew install --cask senzingsdk

      - name: Install Scoop and Senzing runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SENZING_ACCEPT_EULA: I_ACCEPT_THE_SENZING_EULA
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          $env:PATH = "$HOME\scoop\shims;$env:PATH"
          scoop bucket add senzingsdk https://github.com/Senzing/scoop-senzingsdk
          scoop install senzingsdk/senzingsdk
          # Resolve the lib dir now, while scoop is on PATH, and export it for
          # later steps — they run in fresh shells where scoop is NOT on PATH
          # (a per-step $env:PATH change does not persist across steps).
          "SENZING_LIB_PATH=$(scoop prefix senzingsdk)\er\lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: sz-napi
        run: npm ci

      - name: Setup MSVC tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Generate import libraries from DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $senzingLib = $env:SENZING_LIB_PATH
          # Helper function to generate .lib from .dll
          function New-ImportLib($dllPath, $libName) {
            $exports = & dumpbin /exports $dllPath |
              Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)' |
              ForEach-Object { $_.Matches.Groups[1].Value }
            $defContent = "LIBRARY $libName`nEXPORTS`n"
            foreach ($exp in $exports) { $defContent += "  $exp`n" }
            $defPath = Join-Path (Split-Path $dllPath) "$libName.def"
            $libPath = Join-Path (Split-Path $dllPath) "$libName.lib"
            Set-Content -Path $defPath -Value $defContent
            & lib /def:$defPath /out:$libPath /machine:x64 /nologo
            Write-Host "Generated $libName.lib ($($exports.Count) exports)"
          }
          New-ImportLib "$senzingLib\Sz.dll" "Sz"
          New-ImportLib "$senzingLib\sqlite3.dll" "sqlite3"

      - name: Build SDK (macOS)
        if: runner.os == 'macOS'
        working-directory: sz-napi/packages/sdk
        run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: Build SDK (Windows)
        if: runner.os == 'Windows'
        working-directory: sz-napi/packages/sdk
        shell: pwsh
        run: |
          # SENZING_LIB_PATH is exported via GITHUB_ENV in the install step.
          npx napi build --platform --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-${{ matrix.target }}
          path: sz-napi/packages/sdk/*.node
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Create GitHub Release and attach prebuilt .node artifacts
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-configtool, build-sdk-linux, build-sdk-host]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Rename artifacts for release
        run: |
          mkdir -p release-assets
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            for file in "$dir"*.node; do
              [ -f "$file" ] || continue
              base=$(basename "$file")
              cp "$file" "release-assets/${name}-${base}"
            done
          done
          ls -la release-assets/

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: release-assets/*
