[package]
name = "senzing-configtool-napi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi9"] }
napi-derive = "3"
sz_configtool_lib = { git = "https://github.com/brianmacy/sz-rust-sdk-configtool", rev = "e1d2ad06f1cb3599afb753e9c57b507914a2389a" }
serde_json = "1.0"

[build-dependencies]
napi-build = "2"
